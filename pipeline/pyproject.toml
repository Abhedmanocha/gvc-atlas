[project]
name = "mrio"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "openpyxl"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mrio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
